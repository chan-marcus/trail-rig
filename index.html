<style>
:root{
 --bg:#141210;--s1:#1C1916;--s2:#24201C;--s3:#2D2823;--line:#36302A;
 --tx:#EEE9E1;--mu:#A69D90;--fa:#998F82;
 --ac:#E3A63E;--ac2:#EEB656;--red:#E0694E;--good:#A9C47E;--xp:#6E9BD1;
 --fuel:#D19A35;--engine:#C9563F;--susp:#557FA8;--tires:#7F845A;--stoke:#B8A77A;
 --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
p,li,figcaption,dd{text-wrap:pretty}
h1,h2,h3{font:inherit;text-wrap:balance}
ol,ul{list-style:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pn{white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* page */
.app{max-width:1080px;margin:0 auto;padding:24px 24px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:18px;font-weight:800;letter-spacing:.06em}
.brand small{color:var(--mu);font-size:13px;font-weight:500;white-space:nowrap}
.hud{display:flex;align-items:center;gap:8px}
.salv{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--mu);white-space:nowrap}
.salv b{color:var(--ac);font-family:var(--mono);font-weight:500;font-size:15px;margin-right:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px}
.label,.sect{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.label{margin-bottom:14px}
.sect{margin:22px 0 10px}
.sect:first-child{margin-top:0}

/* buttons */
.primary{display:block;width:100%;margin-top:16px;border-radius:12px;padding:12px 16px;background:var(--ac);color:#1A1208;text-align:center;transition:background .15s}
.primary:hover:not(:disabled){background:var(--ac2)}
.primary .pl,.primary .ps{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary .pl{font-size:16px;font-weight:700}
.primary .ps{font-size:13px;font-weight:500;opacity:.75}
.primary:disabled{background:var(--s2);color:var(--mu);cursor:default}
.primary.pulse{animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(227,166,62,.45)}70%,100%{box-shadow:0 0 0 10px rgba(227,166,62,0)}}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--s2);color:var(--tx);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{background:transparent;color:var(--fa);cursor:default}
.btn.go{background:var(--ac);border-color:var(--ac);color:#1A1208}
.btn.go:hover:not(:disabled){background:var(--ac2);border-color:var(--ac2)}
.btn.go:disabled{background:var(--s2);border-color:var(--line);color:var(--fa)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.chip{border-radius:99px}
.btn.icon{width:36px;height:34px;padding:0}
.btn.icon svg{width:18px;height:18px}

/* camp */
.screen{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px}
.screen canvas{display:block;width:100%;aspect-ratio:96/56;image-rendering:pixelated;border-radius:8px;cursor:pointer;touch-action:manipulation;
 background:linear-gradient(180deg,#B7C0C2 0%,#D8D4CA 44%,#E2D2B4 62%,#CDB995 100%)}
.status p{color:var(--mu);font-size:14px}
.status p:first-child{color:var(--tx);font-size:16px;font-weight:600}
.radio{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:9px 10px 9px 14px;border-radius:12px;background:rgba(227,166,62,.1);border:1px solid rgba(227,166,62,.35);font-size:14px}
.pet{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.journal{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.journal .label{margin-bottom:8px}
.journal li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:baseline;font-size:14px;color:var(--mu);padding:3px 0}
.journal li:first-child{color:var(--tx)}
.journal li:nth-child(4){opacity:.92}
.journal li:nth-child(5){opacity:.84}
.journal .d{font-family:var(--mono);font-size:13px;color:var(--fa);white-space:nowrap}
.journal .d.plus{color:var(--ac)}
.journal .empty{color:var(--fa)}

/* rig sheet */
.ident{display:flex;align-items:center;gap:12px}
.name{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed transparent;font-size:20px;font-weight:700;color:var(--tx);padding:0;outline:0}
.name:hover{border-bottom-color:var(--line)}
.name:focus{border-bottom-color:var(--ac)}
.lvchip{font-size:12px;font-weight:700;color:var(--ac);background:rgba(227,166,62,.12);border-radius:99px;padding:3px 10px;white-space:nowrap}
.ident+p{color:var(--mu);font-size:13px;margin-top:2px}
.track{display:block;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--ac);transition:width .5s}
.xp{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin-top:14px;font-size:12px;color:var(--mu)}
.xp .track i{background:var(--xp)}
.gauges{display:grid;gap:10px;margin-top:20px}
.gauge{display:grid;grid-template-columns:6.8em minmax(0,1fr) 2.6em;align-items:center;gap:12px;font-size:13px}
.gauge>span:first-child{color:var(--mu)}
.gauge .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#g-fuel i{background:var(--fuel)}#g-engine i{background:var(--engine)}#g-susp i{background:var(--susp)}#g-tires i{background:var(--tires)}#g-stoke i{background:var(--stoke)}
.gauge.low .track i{background:var(--red)!important}
.gauge.low .v{color:var(--red)}
.gearwrap{margin-top:22px}
.gearwrap .label{margin-bottom:8px}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gear li{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear li.empty{border-style:dashed;background:transparent;color:var(--fa);font-weight:500}

/* trail board */
.tabs,.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs{margin-bottom:20px}
.tabs button,.seg button{border-radius:9px;padding:7px 0;font-size:14px;font-weight:600;color:var(--mu);white-space:nowrap}
.tabs button:hover,.seg button:hover:not(:disabled){color:var(--tx)}
.tabs [aria-selected=true],.seg [aria-pressed=true]{background:var(--s3);color:var(--tx)}
.seg button:disabled{cursor:default}
.new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:6px;vertical-align:middle}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row>h3{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>p{grid-column:1/-1;font-size:13px;color:var(--mu)}
.row>h3+.btn{margin:-2px 0}
.row>h3+.btn+p{margin-top:2px}
.row.on{border-color:rgba(227,166,62,.45)}
.row.on>h3{color:var(--ac)}
.row .con{color:var(--fa)}
.fit-good{color:var(--good)}
.fit-flip{color:var(--ac)}
.fit-long{color:var(--red)}
.trip{background:var(--s2);border:1px solid rgba(227,166,62,.45);border-radius:12px;padding:14px}
.trip h3{font-size:16px;font-weight:700}
.trip .track{margin:10px 0 8px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mu)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:6px;column-gap:12px;font-size:14px;margin-top:12px}
.kv dt{color:var(--mu)}
.kv dd{text-align:right;font-family:var(--mono)}
.hint{font-size:13px;color:var(--fa);margin:-4px 0 10px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--ac)}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:6px;font-size:14px}
.ledger dt{color:var(--mu)}
.ledger dd{text-align:right;font-family:var(--mono);white-space:nowrap}
.ledger .up{color:var(--ac);margin-right:8px}
.ledger dd.word{font-family:var(--sans)}
.ledger .sub{grid-column:1/-1;text-align:left;font-family:var(--sans);font-size:12px;color:var(--fa);margin:-2px 0 8px}
.ledger .sub .track{height:4px;margin:4px 0 5px}
.ledger .gold{color:var(--ac)}
.ledger .red{color:var(--red)}

/* overlays: trail report and rig picker */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,9,8,.8);overflow-y:auto;display:none;padding:48px 16px}
.overlay.show{display:block}
.modal{max-width:40rem;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.mhead h2,.rtitle{font-size:20px;font-weight:700}
.mhead p{color:var(--mu);font-size:13px}
.rside{display:flex;align-items:center;gap:8px;flex:none}
.rsalv{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--mu);white-space:nowrap}
.rsalv b{color:var(--ac);font-family:var(--mono);font-weight:500;margin-right:4px;display:inline-block}
/* report juice: flying numbers, coins, sparks */
.fly{position:fixed;z-index:50;pointer-events:none;font-weight:800;font-size:15px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.fly.salv{color:var(--ac);font-size:18px}
.fly.dmg{color:#EE8D75;font-size:13px}
.fly.fuel{color:var(--mu);font-size:13px}
.fly.chain{color:#A3C2E8}
.coin{position:fixed;z-index:50;pointer-events:none;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE3A0,#E3A63E 60%,#9A6A1A)}
.spark{position:fixed;z-index:50;pointer-events:none;width:5px;height:5px;border-radius:1px;background:var(--ac)}
.log li{display:grid;grid-template-columns:3.4em minmax(0,1fr);column-gap:12px;padding:10px 0;border-top:1px solid var(--line);animation:in .25s ease-out}
.log li:first-child{border-top:0;padding-top:0}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.log .mi{font-family:var(--mono);font-size:12px;color:var(--fa);white-space:nowrap;padding-top:2px}
.log .txt>span{display:block;text-wrap:balance}
.log .wait .txt{color:var(--fa)}
.log .note .txt{color:var(--mu)}
.log .find .mi,.log .find .txt{color:var(--ac)}
.log .bad .mi,.log .strand .mi,.log .strand .txt{color:var(--red)}
.log .chk{font-family:var(--mono);font-size:12px;color:var(--mu);margin-top:4px}
.chk .pass{color:var(--good)}
.chk .close{color:var(--ac)}
.chk .miss{color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--s3);color:var(--tx);white-space:nowrap}
.tag.gain{background:rgba(227,166,62,.14);color:var(--ac)}
.tag.dmg{background:rgba(224,105,78,.15);color:#EE8D75}
.tag.chain{background:rgba(110,155,209,.15);color:#A3C2E8}
.log .btn{margin-top:8px;color:var(--ac);border-color:rgba(227,166,62,.45)}
.log .got,.log .left{display:block;margin-top:6px;font-size:13px}
.log .got{color:var(--ac)}
.log .left{color:var(--fa)}
.result{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.rank{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.rank b{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:12px;background:var(--s3);font-size:24px;font-weight:800}
.rank.S b,.rank.A b{background:var(--ac);color:#1A1208}
.rank.C b{background:rgba(224,105,78,.18);color:var(--red)}
.rank span{display:block;font-size:16px;font-weight:700}
.rank small{display:block;font-size:13px;color:var(--mu)}
.career{margin-top:20px}
.career p{font-size:14px;color:var(--mu);padding:2px 0}
.career .gold{color:var(--ac)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
.pick:hover{border-color:var(--ac)}
.pick b{font-size:16px;font-weight:700}
.pick .btn{pointer-events:none}
.pick span:not(.btn){grid-column:1/-1;font-size:13px;color:var(--mu)}
.pick .s{color:var(--fa)}

.toast{position:fixed;left:50%;bottom:20px;z-index:40;transform:translate(-50%,8px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
 background:var(--s3);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:899px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (min-width:600px) and (max-width:899px){
 .campgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
 .campgrid .screen{margin-bottom:0}
}
@media (max-width:599px){
 .app{padding:16px 16px 48px}
 .top{margin-bottom:16px}
 .brand{display:block}
 .brand small{display:block}
 .card{padding:16px;border-radius:14px}
 .layout,.col{gap:14px}
 .overlay{padding:16px 10px}
 .modal{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){
 .primary.pulse,.log li{animation:none}
 .track i,.toast{transition:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="brand"><b>TRAIL RIG</b><small>Venture the Terrain</small></h1>
    <div class="hud"><span class="salv"><b id="salv">0</b>salvage</span><button class="btn icon" id="mute" aria-label="Mute sound"></button></div>
  </header>
  <div class="layout">
    <div class="col">
      <section class="card" id="camp">
        <h2 class="label">Camp</h2>
        <div class="campgrid">
          <div class="screen"><canvas id="c" width="96" height="56" aria-label="Your rig. Tap to rev the engine."></canvas></div>
          <div>
            <div class="status" id="status"></div>
            <div class="radio" id="radio" hidden></div>
            <button class="primary" id="primary"><span class="pl" id="pl"></span><span class="ps" id="ps"></span></button>
            <div class="pet" id="pet"><button class="btn sm chip" id="rev">Rev the engine</button><button class="btn sm chip" id="wash">Wash off the mud</button></div>
          </div>
        </div>
        <div class="journal"><h3 class="label">Journal</h3><ol id="journal"></ol></div>
      </section>
      <section class="card" id="rig">
        <h2 class="label">Rig</h2>
        <div class="ident"><input id="name" class="name" maxlength="16" spellcheck="false" autocomplete="off" aria-label="Rig name"><span class="lvchip" id="lvChip">LV 1</span></div>
        <p id="rigSub"></p>
        <div class="xp"><span class="track" id="b-xp"><i></i></span><span class="num" id="v-xp"></span></div>
        <div class="gauges">
          <div class="gauge" id="g-fuel"><span>Fuel</span><span class="track"><i></i></span><span class="v"></span></div>
          <div class="gauge" id="g-engine"><span>Engine</span><span class="track"><i></i></span><span class="v"></span></div>
          <div class="gauge" id="g-susp"><span>Suspension</span><span class="track"><i></i></span><span class="v"></span></div>
          <div class="gauge" id="g-tires"><span>Tires</span><span class="track"><i></i></span><span class="v"></span></div>
          <div class="gauge" id="g-stoke"><span>Stoke</span><span class="track"><i></i></span><span class="v"></span></div>
        </div>
        <div class="gearwrap"><h3 class="label"><span>Gear</span><span id="gearCount"></span></h3><ul class="gear" id="gear"></ul></div>
      </section>
    </div>
    <section class="card board" id="board">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="routes">Trails</button>
        <button role="tab" aria-selected="false" data-tab="garage">Workshop</button>
        <button role="tab" aria-selected="false" data-tab="stats">Ledger<span class="new" id="statDot" hidden></span></button>
      </div>
      <div id="panel" role="tabpanel"></div>
    </section>
  </div>
</main>

<div class="overlay" id="report" role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <section class="modal">
    <div class="mhead"><div><h2 class="pn" id="rTitle"></h2><p id="rMeta"></p></div><div class="rside"><span class="rsalv"><b id="tSalv">0</b>salvage</span><button class="btn sm" id="rSkip">Skip</button></div></div>
    <ol class="log" id="rLog"></ol>
    <div class="result" id="result" hidden></div>
    <button class="primary" id="rDone" hidden><span class="pl">Triage the rig</span><span class="ps">Back to camp</span></button>
  </section>
</div>
<div class="overlay" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickH">
  <section class="modal">
    <div class="mhead"><div><h2 id="pickH">Pick your rig</h2><p>Swap rigs any time in the workshop.</p></div></div>
    <ol class="list" id="pickList"></ol>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- data ---------- */
const MIN=6e4,HR=36e5;
const RIGS={
 scout:{name:'Scout',desc:'Light and thrifty. Breaks easily.',cap:2,rel:2,range:6,bed:22,r:5},
 hauler:{name:'Hauler',desc:'Balanced midsize. No big weakness.',cap:4,rel:4,range:4,bed:26,r:6},
 brute:{name:'Brute',desc:'Heavy and capable. Drinks fuel.',cap:6,rel:4,range:2,bed:30,r:7}
};
const UPS={
 at:{name:'All-terrain tires',cost:40,w:1,good:'+1 desert, +1 rock',bad:'adds weight',mod:s=>{s.cap.desert++;s.cap.rock++}},
 mt:{name:'Mud tires',cost:40,w:1,good:'+2 mud',bad:'-1 desert, adds weight',mod:s=>{s.cap.mud+=2;s.cap.desert--}},
 locker:{name:'Front locker',cost:70,w:0,good:'+1 mud, +1 rock',bad:'-1 reliability',mod:s=>{s.cap.mud++;s.cap.rock++;s.rel--}},
 winch:{name:'Winch',cost:80,w:2,good:'self-recover in bogs and dunes',bad:'heavy',mod:s=>{s.winch=true}},
 snorkel:{name:'Snorkel',cost:60,w:0,good:'safe deep creek crossings',bad:'useless off mud routes',mod:s=>{s.snorkel=true}},
 lift:{name:'2 inch lift',cost:90,w:1,good:'+1 on all terrain',bad:'-1 reliability, weight',mod:s=>{s.cap.desert++;s.cap.mud++;s.cap.rock++;s.rel--}},
 aux:{name:'Aux fuel tank',cost:60,w:2,good:'+2 range',bad:'heavy',mod:s=>{s.range+=2}},
 skids:{name:'Skid plates',cost:70,w:2,good:'halves rock damage',bad:'heavy',mod:s=>{s.skids=true}}
};
const LEN={
 tut:{label:'Tutorial',miles:8,dur:2*MIN,events:4},
 short:{label:'Short',miles:12,dur:5*MIN,events:5},
 day:{label:'Day trip',miles:30,dur:HR,events:7},
 long:{label:'Long haul',miles:60,dur:4*HR,events:9}
};
const NAMES={
 desert:['Dry Lake Two-Track','Borrego Wash','Sidewinder Flats','Mesquite Spur','Ghost Mine Road'],
 mud:['Cedar Creek Ruts','Hollow Log Trail','Blackwater Grade','Fern Gully Cutoff','Rainshadow Loop'],
 rock:['Granite Stairs','Slickrock Shelf','Boulder Alley','Hell Gate Notch','Talus Ridge']
};
const PARTS={engine:'Engine',susp:'Suspension',tires:'Tires'};
const T=d=>4+d*2, TR=d=>3+d*2;

/* ---------- event table: 15 events, 5 per terrain ---------- */
const EVENTS={
 desert:[
  {w:3,f:c=>{if(c.check(c.S.cap.desert,c.T))c.ok('Deep sand wash. Aired down and floated across.');
   else{c.bad('Bogged in a sand wash. Dug out by hand.');c.fuel(6);c.dmg('tires',8)}}},
  {w:2,f:c=>{if(c.check(c.S.rel+c.eng(),c.TR))c.ok('Heat hit 108°F. Temp needle held steady.');
   else{c.bad('Engine ran hot climbing out of the basin.');c.dmg('engine',18)}}},
  {w:2,f:c=>{if(c.check(c.S.cap.desert,c.T+1))c.ok('Crested the big dune on the first run.');
   else if(c.S.winch){c.bad('Stalled on the dune face. Winched off a buried spare.');c.fuel(8)}
   else if(c.diff>=3){c.bad('Slid sideways off the dune face.');c.strand('Buried to the axles on a dune.')}
   else{c.bad('Stalled on the dune face and slid back down.');c.dmg('susp',12);c.dmg('tires',8)}}},
  {w:2,f:c=>{c.note('Long empty stretch. Burned extra fuel finding the track.');c.fuel(Math.max(2,Math.round(14-c.S.range*2)))}},
  {w:1,f:c=>c.find('Old prospector camp. Pulled usable parts from the scrap pile.',10+c.diff*8)}
 ],
 mud:[
  {w:3,f:c=>{if(c.check(c.S.cap.mud,c.T))c.ok('Knee-deep ruts. Kept momentum and never stopped.');
   else{c.bad('Dropped a wheel in the ruts and high-centered.');c.dmg('susp',15);c.fuel(5)}}},
  {w:2,f:c=>{if(c.S.snorkel)c.ok('Creek running high. Snorkel kept the intake dry.');
   else if(c.check(c.S.cap.mud,c.T+1))c.ok('Creek higher than forecast. Crossed with water at the headlights.');
   else{c.bad('Water over the hood at the creek. Engine hydrolocked.');c.dmg('engine',45)}}},
  {w:2,f:c=>{if(c.check(c.S.cap.mud,c.T))c.ok('Bog hole the size of a pool. Plowed straight through.');
   else if(c.S.winch){c.bad('Sank to the frame in a bog. Winched out off a cedar.');c.fuel(10)}
   else if(c.diff===1){c.bad('Sank in a bog. Rocked it out after an hour.');c.fuel(12);c.dmg('susp',8)}
   else{c.bad('Sank to the frame in a bog. No winch, no way out.');c.strand('Stuck in a bog hole.')}}},
  {w:2,f:c=>{if(c.check(c.S.rel+c.eng(),c.TR))c.ok('Rain all afternoon. Wipers and wiring held up.');
   else{c.bad('Rain got into the wiring. Engine started misfiring.');c.dmg('engine',12)}}},
  {w:1,f:c=>c.find('Towed out a stuck pickup. They paid you in parts.',12+c.diff*8)}
 ],
 rock:[
  {w:3,f:c=>{if(c.check(c.S.cap.rock,c.T))c.ok('Picked a clean line through the rock garden.');
   else if(c.diff>=3&&!c.S.skids){c.bad('Came down hard on a boulder. Punched the oil pan.');c.strand('Oil pan holed in the rock garden.')}
   else{c.bad('Dragged the diffs through the rock garden.');c.dmg('susp',18)}}},
  {w:2,f:c=>{if(c.check(c.S.cap.rock,c.T+1))c.ok('Two-foot ledge. Crawled it without a bump.');
   else{c.bad('Bounced off a ledge and cut a sidewall.');c.dmg('tires',25)}}},
  {w:2,f:c=>{if(c.check(c.S.rel,c.TR))c.ok('Shelf road over a 300-foot drop. Steady hands.');
   else{c.bad('Shelf road washed out. Backtracked six miles.');c.fuel(10)}}},
  {w:2,f:c=>{if(c.check(c.S.rel+(c.p.tires>60?1:-1),c.TR))c.ok('A mile of sharp shale. Tires shrugged it off.');
   else{c.bad('Sharp shale shredded a tire. Bolted on the spare.');c.dmg('tires',30)}}},
  {w:1,f:c=>c.find('Old mine adit. Hauled out rusty but useful gear.',10+c.diff*8)}
 ]
};

/* ---------- pure resolver: (rig, upgrades, start, route, seed) => report ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildStats(rig,ups){
 const R=RIGS[rig],s={cap:{desert:R.cap,mud:R.cap,rock:R.cap},rel:R.rel,range:R.range,weight:0,winch:false,snorkel:false,skids:false};
 ups.forEach(id=>{s.weight+=UPS[id].w;UPS[id].mod(s)});
 s.range=Math.max(1.5,s.range-s.weight*.4);return s;
}
const fuelPerMile=S=>8/(S.range+2);
function resolve(rig,ups,start,route,seed){
 const S=buildStats(rig,ups),r=rng(seed),p={...start},lines=[];
 let salvage=0,stoke=0,stranded=null;
 const per=route.miles*fuelPerMile(S)/route.events;
 const table=EVENTS[route.terrain],tw=table.reduce((a,e)=>a+e.w,0);
 for(let i=0;i<route.events&&!stranded;i++){
  const mile=Math.max(1,Math.round((i+1)/route.events*route.miles-r()*route.miles/route.events*.6));
